name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Sync config.json to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp config.json android/app/src/main/assets/config.json

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK with Gradle & R8
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ShinseiAnime-Release.apk
          ls -lh ShinseiAnime-Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: ShinseiAnime-Release.apk

  build-c-binaries:
    name: Build C Binaries (x86_64 & aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install x86_64 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make libcurl4-openssl-dev

      - name: Build anime-lite x86_64
        run: |
          make -C lite clean
          make -C lite
          strip lite/bin/anime-lite
          cp lite/bin/anime-lite anime-lite-linux-x86_64
          ls -lh anime-lite-linux-x86_64

      - name: Set up QEMU for aarch64 build
        uses: docker/setup-qemu-action@v3

      - name: Build anime-lite aarch64 in container
        run: |
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE":/src alpine:latest sh -c \
            "apk add --no-cache gcc musl-dev curl-dev make && cd /src/lite && make clean && make && strip bin/anime-lite && cp bin/anime-lite /src/anime-lite-linux-aarch64"
          ls -lh anime-lite-linux-aarch64

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: c-binaries
          path: |
            anime-lite-linux-x86_64
            anime-lite-linux-aarch64

  build-python:
    name: Build Python Wheel & Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: pip install build wheel setuptools

      - name: Build distributions
        run: python3 setup.py sdist bdist_wheel

      - name: Upload Python dists
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [build-apk, build-c-binaries, build-python]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-artifact
          path: release-files/

      - name: Download C Binaries
        uses: actions/download-artifact@v4
        with:
          name: c-binaries
          path: release-files/

      - name: Download Python Dists
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: release-files/

      - name: Add install script
        run: |
          cp install.sh release-files/
          ls -la release-files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag || 'v1.2.0' }}
          name: "v1.2.0 - The Trinity Architecture ⚡"
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
