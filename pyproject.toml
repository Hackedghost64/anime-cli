[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-cli"
version = "1.0.0"
description = "⚡ Next-Gen Anime Streaming & Browser CLI with AniSkip auto-skipping and zero-config tunneling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "curl_cffi>=0.7.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "qrcode>=8.0",
]

[project.scripts]
anime-cli = "cli:main"
