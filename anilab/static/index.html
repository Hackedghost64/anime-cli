<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Shinsei Anime — Private Stream Service</title>
  
  <!-- Modern Font & Styling -->
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  
  <!-- HLS.js Video Engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <header id="navbar">
    <a href="#/" class="brand">
      <div class="logo-icon">▶</div>
      <div>SHINSEI<span>ANIME</span></div>
    </a>

    <nav class="nav-links">
      <a href="#/" class="nav-link active" data-nav="home">Home</a>
      <a href="#/watchlist" class="nav-link" data-nav="watchlist">My Watchlist</a>
    </nav>

    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="globalSearch" placeholder="Search anime (e.g. Solo Leveling, One Piece)...">
    </div>
  </header>

  <!-- Dynamic Content Area -->
  <main id="content">
    <div style="display:flex;justify-content:center;padding:100px 0;">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Mobile Bottom App Bar -->
  <nav class="mobile-nav">
    <a href="#/" class="mobile-nav-item active" data-nav="home">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="javascript:void(0)" class="mobile-nav-item" onclick="document.getElementById('globalSearch')?.focus()">
      <span class="icon">🔍</span>
      <span>Search</span>
    </a>
    <a href="#/watchlist" class="mobile-nav-item" data-nav="watchlist">
      <span class="icon">📑</span>
      <span>Watchlist</span>
    </a>
  </nav>

  <!-- Toast Notification Hub -->
  <div id="toast-container"></div>

  <!-- App Script -->
  <script src="/static/app.js"></script>
</body>
</html>
